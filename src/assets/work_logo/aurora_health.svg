    <rect x="102" y="100" width="210" height="44" rx="22" fill="#fff" opacity=".07"/>
    <circle cx="130" cy="122" r="7" fill="#79f3c8"/>
    <text x="151" y="128" font-size="14" font-weight="700" letter-spacing="1" fill="#b8f7e1">AI HEALTH COMPANION</text>
    <text x="102" y="258" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-weight="700" fill="#fff">Aurora</text>
    <text x="108" y="310" font-size="25" fill="#a8b1ca">Wellness that listens.</text>
    <text x="108" y="376" font-size="17" fill="#c4cbdd">Track hydration, sleep, habits, nutrition,</text>
    <text x="108" y="407" font-size="17" fill="#c4cbdd">and take action through a voice companion.</text>
    <rect x="105" y="464" width="174" height="47" rx="23" fill="#79f3c8" opacity=".12" stroke="#79f3c8" stroke-opacity=".3"/>
    <text x="139" y="494" font-size="14" font-weight="700" fill="#79f3c8">VOICE ACTIONS</text>
    <rect x="294" y="464" width="174" height="47" rx="23" fill="#7ba7ff" opacity=".12" stroke="#7ba7ff" stroke-opacity=".3"/>
    <text x="330" y="494" font-size="14" font-weight="700" fill="#a8c2ff">LOCAL FIRST</text>
    <text x="108" y="570" font-size="16" font-weight="700" letter-spacing="3" fill="#8f99b5">EXPO · REACT NATIVE</text>
