<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Aurora AI health companion preview</title>
  <desc id="desc">AI-powered mobile wellness and health tracking application preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11152b"/>
      <stop offset="1" stop-color="#201b3d"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79f3c8"/>
      <stop offset=".5" stop-color="#7ba7ff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 140C230 10 370 255 600 115S970 50 1200 165" fill="none" stroke="url(#aurora)" stroke-width="110" opacity=".08"/>
  <circle cx="980" cy="100" r="240" fill="#7ba7ff" opacity=".08"/>
  <g transform="translate(740 36) rotate(3 168 300)" filter="url(#shadow)">
    <rect width="336" height="604" rx="57" fill="#080b18"/>
    <rect x="13" y="13" width="310" height="578" rx="46" fill="#15192c"/>
    <rect x="110" y="24" width="116" height="24" rx="12" fill="#080b18"/>
    <text x="36" y="92" font-family="Arial, sans-serif" font-size="13" fill="#9aa3bf">Good morning, Satyam</text>
    <text x="36" y="124" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Your daily balance</text>
    <circle cx="168" cy="234" r="80" fill="none" stroke="#282d44" stroke-width="18"/>
    <circle cx="168" cy="234" r="80" fill="none" stroke="url(#aurora)" stroke-width="18" stroke-linecap="round" stroke-dasharray="410 503" transform="rotate(-90 168 234)"/>
    <text x="133" y="229" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">82%</text>
    <text x="139" y="253" font-family="Arial, sans-serif" font-size="11" fill="#9aa3bf">WELLNESS</text>
    <g transform="translate(32 346)" font-family="Arial, sans-serif">
      <rect width="128" height="94" rx="22" fill="#202640"/>
      <circle cx="27" cy="27" r="12" fill="#7ba7ff" opacity=".25"/>
      <path d="M27 17c-8 10-8 15 0 20 8-5 8-10 0-20z" fill="#7ba7ff"/>
      <text x="19" y="61" font-size="12" fill="#9aa3bf">Hydration</text>
      <text x="19" y="82" font-size="16" font-weight="700" fill="#fff">1.8 / 2.5 L</text>
      <rect x="144" width="128" height="94" rx="22" fill="#202640"/>
      <circle cx="171" cy="27" r="12" fill="#c084fc" opacity=".25"/>
      <path d="M174 18a10 10 0 1 0 8 15 11 11 0 1 1-8-15z" fill="#c084fc"/>
      <text x="163" y="61" font-size="12" fill="#9aa3bf">Sleep</text>
      <text x="163" y="82" font-size="16" font-weight="700" fill="#fff">7h 24m</text>
    </g>
    <rect x="32" y="462" width="272" height="90" rx="24" fill="url(#aurora)" opacity=".16"/>
    <circle cx="70" cy="507" r="23" fill="url(#aurora)"/>
    <path d="M64 507h12m-6-6v12" stroke="#101426" stroke-width="3" stroke-linecap="round"/>
    <text x="105" y="498" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Talk to Aurora</text>
    <text x="105" y="521" font-family="Arial, sans-serif" font-size="11" fill="#b1b8ce">Log health with your voice</text>
  </g>
